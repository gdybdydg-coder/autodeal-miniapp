name: Isolated discovery and free-search verification

on:
  push:
    branches: [wip/free-search-recovery-20261002]
    paths:
      - 'backend/**'
      - 'experiments/free_search/**'
      - 'tools/offline_pytest.py'
      - '.github/workflows/free-recovery-verification.yml'

permissions:
  contents: read

concurrency:
  group: free-recovery-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autodeal_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: autodeal_manual_fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U autodeal_fixture -d autodeal_manual_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend regression with network fence and synthetic PostgreSQL
        env:
          AUTODEAL_TEST_POSTGRES_URL: postgresql+psycopg://autodeal_fixture:fixture-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/autodeal_manual_fixture
        run: python -m pytest backend/tests -q
      - name: Free-search regression with outbound guard
        run: python -m unittest discover -s experiments/free_search/tests -v
      - name: Cold-cache synthetic full-flow comparison
        run: python -m experiments.free_search.recovery_benchmark --output "$RUNNER_TEMP/free-recovery-benchmark.json"
