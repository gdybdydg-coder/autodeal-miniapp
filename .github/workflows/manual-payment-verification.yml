name: Isolated manual-payment verification

on:
  push:
    branches: [wip/manual-payment-verification-20261002, wip/manual-card-launch-20261002]
    paths:
      - 'backend/**'
      - '!backend/docs/**'
      - '*-test.cjs'
      - 'payment-review*'
      - 'billing-ui.js'
      - 'index.html'
      - 'tools/manual-payment-ui-smoke.cjs'
      - '.github/workflows/manual-payment-verification.yml'

permissions:
  contents: read

concurrency:
  group: manual-payment-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: autodeal_fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: autodeal_manual_fixture
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U autodeal_fixture -d autodeal_manual_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm install --prefix "$RUNNER_TEMP/manual-ui" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/manual-ui/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
      - name: SQLite and isolated PostgreSQL transactions and authentication
        env:
          AUTODEAL_TEST_POSTGRES_URL: postgresql+psycopg://autodeal_fixture:fixture-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/autodeal_manual_fixture
        run: python -m pytest backend/tests/test_manual_payments.py backend/tests/test_manual_checkout.py backend/tests/test_subscription_preview.py backend/tests/test_billing_launch.py -q
      - name: Frontend behavior
        run: node --test ./*-test.cjs
      - name: Mobile browser with fully mocked network
        env:
          NODE_PATH: ${{ runner.temp }}/manual-ui/node_modules
        run: node tools/manual-payment-ui-smoke.cjs
