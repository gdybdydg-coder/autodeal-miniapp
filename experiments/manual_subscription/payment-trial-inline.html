<div id="autodeal-payment-trial" class="autodeal-trial">
  <header><strong>AUTO<span>Deal</span></strong><small>Тест · без переказу коштів</small></header>
  <nav aria-label="Роль у тесті"><button class="cursor-interaction" type="button" data-ui="client-tab" aria-pressed="true">Клієнт</button><button class="cursor-interaction" type="button" data-ui="admin-tab" aria-pressed="false">Адміністратор</button></nav>
  <main>
    <div class="ad-plan"><span data-ui="tariff">249 грн · 30 днів · тест</span><h2 data-ui="status" aria-live="polite">Завантаження…</h2><small data-ui="order-id"></small></div>
    <section data-ui="client">
      <p data-ui="access" aria-live="polite"></p><p class="ad-note" data-ui="note" hidden></p>
      <button type="button" class="ad-main cursor-interaction" data-ui="create">Створити тестову заявку</button>
      <button type="button" class="ad-main cursor-interaction" data-ui="paid" hidden>Я оплатив</button>
      <div class="ad-receipt" data-ui="receipt-area" hidden><span>Квитанція DEMO</span><small>249 грн · вигаданий переказ</small><button type="button" class="ad-main cursor-interaction" data-ui="receipt">Надіслати тестову квитанцію</button></div>
      <p data-ui="review-message" hidden>Квитанція на перевірці. Перейди до ролі адміністратора.</p>
    </section>
    <section data-ui="admin" hidden>
      <p data-ui="admin-summary"></p><p data-ui="admin-done" hidden></p>
      <div data-ui="admin-form" hidden>
        <label>Сума тестового надходження, грн<input data-ui="amount" type="number" min="1" value="249" inputmode="numeric"></label>
        <label class="ad-check"><input data-ui="verified" type="checkbox">Тестове надходження перевірено</label>
        <button type="button" class="ad-main cursor-interaction" data-ui="approve">Підтвердити 30 днів</button>
        <label>Уточнення<textarea data-ui="clarification" maxlength="500" rows="2">Уточни час тестового переказу</textarea></label>
        <div class="ad-actions"><button class="cursor-interaction" type="button" data-ui="clarify">Попросити уточнення</button><button class="cursor-interaction" type="button" data-ui="reject">Відхилити</button></div>
      </div>
    </section>
    <p class="ad-error" data-ui="error" role="alert"></p>
  </main><footer>Тестовий доступ · Пошук авто не вмикається</footer>
</div>
<style>
.autodeal-trial{color-scheme:light dark;--ad-bg:light-dark(#fff,#121820);--ad-text:light-dark(#13202b,#e6eef5);--ad-muted:light-dark(#536273,#a9b9c9);--ad-panel:light-dark(#f2f5f7,#1c2631);--ad-line:light-dark(#d6dee6,#354553);--ad-blue:light-dark(#007b9f,#46d3ed);--ad-onblue:light-dark(#fff,#08242b);--ad-red:light-dark(#ae1635,#ff8098);font-family:system-ui,sans-serif;font-size:15px;line-height:1.45;font-weight:400;background:var(--ad-bg);color:var(--ad-text);max-width:460px;margin:16px auto;border:1px solid var(--ad-line);border-radius:20px;overflow:hidden}
.autodeal-trial *{box-sizing:border-box}
.autodeal-trial [hidden]{display:none!important}
.autodeal-trial header{padding:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.autodeal-trial header strong{font-size:22px;font-weight:500}.autodeal-trial header span{color:var(--ad-blue)}
.autodeal-trial small,.autodeal-trial footer{color:var(--ad-muted);font-size:12px;font-weight:400}
.autodeal-trial nav{display:flex;gap:6px;padding:0 20px 12px}
.autodeal-trial button{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--ad-line);background:var(--ad-bg);color:var(--ad-text);padding:10px 12px;font-weight:500}
.autodeal-trial button[aria-pressed=true]{background:var(--ad-panel);border-color:var(--ad-blue)}
.autodeal-trial button:disabled{opacity:.55}
.autodeal-trial .ad-main{display:block;width:100%;background:var(--ad-blue);color:var(--ad-onblue);border-color:var(--ad-blue);margin:12px 0}
.autodeal-trial main{padding:0 20px 16px}
.autodeal-trial .ad-plan{background:var(--ad-panel);padding:16px;border-radius:12px}
.autodeal-trial h2{font-size:18px;font-weight:500;margin:7px 0}
.autodeal-trial p{margin:12px 0}
.autodeal-trial label{display:block;margin:12px 0}
.autodeal-trial input:not([type=checkbox]),.autodeal-trial textarea{display:block;width:100%;font:inherit;font-size:16px;background:var(--ad-bg);color:var(--ad-text);border:1px solid var(--ad-line);border-radius:8px;padding:10px;margin-top:5px}
.autodeal-trial .ad-check{display:flex;align-items:center;gap:8px;min-height:44px}
.autodeal-trial .ad-check input{width:20px;height:20px;flex:none}
.autodeal-trial .ad-actions{display:flex;flex-wrap:wrap;gap:8px}
.autodeal-trial .ad-receipt{padding:14px;background:var(--ad-panel);border-radius:10px}
.autodeal-trial .ad-receipt small{display:block}
.autodeal-trial .ad-note{padding:10px;border-left:3px solid var(--ad-blue);background:var(--ad-panel)}
.autodeal-trial .ad-error{color:var(--ad-red)}
.autodeal-trial .ad-error:empty{display:none}
.autodeal-trial footer{padding:12px 20px;background:var(--ad-panel)}
@media(max-width:360px){.autodeal-trial{margin:4px auto}.autodeal-trial header,.autodeal-trial main{padding-left:14px;padding-right:14px}.autodeal-trial nav{padding-left:14px;padding-right:14px}.autodeal-trial nav button{flex:1}}

#autodeal-payment-trial header{padding-right:100px}
</style>
<script>
(function(root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.ManualDemo = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function() {
  'use strict';
  const DAY = 86400;
  const MAX_RECEIPT_AGE = 7 * DAY;
  const CLOCK_SKEW = 300;
  const REFERENCE_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{2,99}$/;

  function syntheticReference(value, label) {
    if (typeof value !== 'string' || value !== value.trim() || !REFERENCE_RE.test(value)) {
      throw Error('Некоректний ' + label);
    }
    return value;
  }

  function boundedText(value, limit, message, allowNewline) {
    const controls = allowNewline ? /[\x00-\x09\x0b-\x1f\x7f]/ : /[\x00-\x1f\x7f]/;
    if (typeof value !== 'string' || value !== value.trim() || !value.length ||
        value.length > limit || controls.test(value)) {
      throw Error(message);
    }
    return value;
  }

  function transition(order, action, now) {
    const next = {...order};
    if (!Number.isSafeInteger(now) || now <= 0) throw Error('Некоректний час');
    if (action.type === 'receipt') {
      if (!['awaiting', 'clarification'].includes(order.state)) {
        throw Error('Заявка вже на перевірці або закрита');
      }
      if (!Number.isSafeInteger(action.paidAt) || action.paidAt <= 0 ||
          action.paidAt < order.created || action.paidAt < now - MAX_RECEIPT_AGE ||
          action.paidAt > now + CLOCK_SKEW) {
        throw Error('Час квитанції поза дозволеним тестовим діапазоном');
      }
      next.receipt = boundedText(
        action.filename, 200, 'Обери коректну назву тестової квитанції', false,
      );
      next.receiptReference = syntheticReference(action.receiptReference, 'номер квитанції');
      next.receiptAt = action.paidAt;
      next.receiptRevision = (order.receiptRevision || 0) + 1;
      next.state = 'review';
      next.note = '';
    } else if (action.type === 'clarify') {
      if (order.state !== 'review') throw Error('Спочатку потрібна квитанція');
      const note = typeof action.note === 'string' ? action.note.trim() : '';
      if (!note || note.length > 500 || /[\x00-\x09\x0b-\x1f\x7f]/.test(action.note)) {
        throw Error('Вкажи уточнення до 500 символів');
      }
      next.note = note;
      next.state = 'clarification';
    } else if (action.type === 'approve') {
      if (order.state !== 'review') throw Error('Заявка недоступна для підтвердження');
      if (action.bankVerified !== true) throw Error('Познач тестову звірку надходження');
      const paymentReference = syntheticReference(action.reference, 'номер платежу');
      if (action.amount !== order.amount) throw Error('Сума не збігається');
      if ((action.usedReferences || []).includes(paymentReference)) {
        throw Error('Цей платіж уже зараховано');
      }
      next.state = 'approved';
      next.reference = paymentReference;
      next.expires = Math.max(now, order.expires || 0) + order.days * DAY;
    } else if (action.type === 'reject') {
      if (!['review', 'clarification'].includes(order.state)) {
        throw Error('Заявка недоступна для відмови');
      }
      next.state = 'rejected';
    } else {
      throw Error('Невідома дія');
    }
    return next;
  }

  return {transition, DAY, MAX_RECEIPT_AGE, CLOCK_SKEW};
});

</script>
<script>
(function(root,factory){
  const api=factory(typeof module==='object'&&module.exports ? require('./workflow.js') : root.ManualDemo);
  if(typeof module==='object'&&module.exports) module.exports=api;
  else root.AutoDealTrialMemory=api;
})(typeof globalThis!=='undefined'?globalThis:this,function(Workflow){
  'use strict';
  function create() {
    let order=null, membershipExpiry=null, sequence=0;
    const usedReferences=[];
    const now=()=>Math.floor(Date.now()/1000);
    function state(role) {
      if(!['client','admin'].includes(role)) throw Error('Невідома тестова роль');
      return {amount:249,days:30,search_enabled:false,
        order:order ? {...order,expires_at:order.expires||null,clarification:order.state==='clarification'?order.note:null} : null,
        membership:{expires_at:membershipExpiry,active:!!membershipExpiry&&now()<membershipExpiry}};
    }
    function action(role,body) {
      state(role);
      if(body.action==='create') {
        if(role!=='client') throw Error('Створи заявку у вкладці клієнта');
        if(!order||['approved','rejected'].includes(order.state))
          order={id:'AD-DEMO-'+(++sequence),state:'awaiting',amount:249,days:30,
            created:now(),expires:membershipExpiry||0,note:'',receiptRevision:0};
      } else {
        if(!order||body.order_id!==order.id) throw Error('Заявку не знайдено');
        const client=body.action==='receipt';
        if(role!==(client?'client':'admin')) throw Error('Ця дія недоступна в обраній ролі');
        const d=body.data;
        let event;
        if(client) event={type:'receipt',filename:'DEMO.pdf',receiptReference:d.receipt_ref,paidAt:d.paid_at};
        else if(body.action==='approve') event={type:'approve',amount:d.actual_amount,
          bankVerified:d.bank_verified,reference:d.payment_ref,usedReferences};
        else if(body.action==='clarify') event={type:'clarify',note:d.note};
        else if(body.action==='reject') event={type:'reject'};
        else throw Error('Невідома дія');
        order=Workflow.transition(order,event,now());
        if(body.action==='approve') {membershipExpiry=order.expires;usedReferences.push(d.payment_ref);}
      }
      return state(role);
    }
    return {state,action};
  }
  return {create};
});

</script>
<script>
(function(root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.AutoDealPaymentUI = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function() {
  'use strict';
  const names = {awaiting:'Очікує квитанцію', review:'На перевірці',
    clarification:'Потрібне уточнення', approved:'Підтверджено', rejected:'Відхилено'};
  function date(value) {
    return value ? new Intl.DateTimeFormat('uk-UA', {timeZone:'Europe/Kyiv',
      day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(value * 1000) : '—';
  }
  function mount(root, api) {
    const $ = id => root.querySelector('[data-ui="' + id + '"]');
    let role='client', view=null, busy=false, receiptOpen=false;
    let receiptSequence=0, paymentSequence=0;
    const buttons=['client-tab','admin-tab','create','paid','receipt','approve','clarify','reject'];
    function render() {
      if (!view) return;
      const order=view.order, state=order?.state;
      $('client-tab').setAttribute('aria-pressed',String(role==='client'));
      $('admin-tab').setAttribute('aria-pressed',String(role==='admin'));
      $('client').hidden=role!=='client'; $('admin').hidden=role!=='admin';
      $('tariff').textContent=view.amount+' грн · '+view.days+' днів · тест';
      $('order-id').textContent=order ? 'Заявка '+order.id : 'Заявку ще не створено';
      $('status').textContent=order ? names[state] : 'Почни тестову заявку';
      $('access').textContent=view.membership.active ? 'Абонемент активний до '+date(view.membership.expires_at) : 'Абонемент неактивний';
      $('note').textContent=order?.clarification || '';
      $('note').hidden=!order?.clarification;
      $('create').hidden=!!order && !['approved','rejected'].includes(state);
      $('create').textContent=state==='approved' ? 'Спробувати продовження' : 'Створити тестову заявку';
      const canSend=['awaiting','clarification'].includes(state);
      $('paid').hidden=!canSend || receiptOpen;
      $('paid').textContent=state==='clarification' ? 'Виправити квитанцію' : 'Я оплатив';
      $('receipt-area').hidden=!canSend || !receiptOpen;
      $('review-message').hidden=state!=='review';
      $('admin-summary').textContent=order ? names[state]+' · '+order.amount+' грн' : 'Спочатку створи заявку як клієнт';
      $('admin-form').hidden=state!=='review';
      $('admin-done').hidden=state==='review' || !order;
      $('admin-done').textContent=state==='approved' ? 'Підтвердження збережене. Перевір вкладку клієнта.' : names[state] || '';
      for (const id of buttons) $(id).disabled=busy;
    }
    async function load() {
      busy=true;
      try { view=await api.state(role); $('error').textContent=''; }
      catch(e) { $('error').textContent=e.message; }
      finally { busy=false; render(); }
    }
    async function act(action,data={},orderId=view?.order?.id || null) {
      if (busy) return;
      busy=true; render(); $('error').textContent='';
      try {
        view=await api.action(role,{action,order_id:orderId,data});
        receiptOpen=false;
      } catch(e) { $('error').textContent=e.message; }
      finally { busy=false; render(); }
    }
    for (const name of ['client','admin']) $(''+name+'-tab').addEventListener('click',async()=>{
      if(busy) return; role=name; receiptOpen=false; await load();
    });
    $('create').addEventListener('click',()=>act('create',{},null));
    $('paid').addEventListener('click',()=>{receiptOpen=true;render();});
    $('receipt').addEventListener('click',()=>act('receipt',{
      receipt_ref:'SYNTH-RECEIPT-'+(++receiptSequence)+'-'+Date.now(),paid_at:Math.floor(Date.now()/1000)}));
    $('approve').addEventListener('click',()=>act('approve',{
      actual_amount:Number($('amount').value),bank_verified:$('verified').checked,
      payment_ref:'SYNTH-PAY-'+(++paymentSequence)+'-'+Date.now()}));
    $('clarify').addEventListener('click',()=>act('clarify',{note:$('clarification').value}));
    $('reject').addEventListener('click',()=>act('reject'));
    return {ready:load(),state:()=>({role,view,busy})};
  }
  return {mount};
});

</script>
<script>

(function(){
  const root=document.getElementById('autodeal-payment-trial');
  window.AutoDealTrialApi=window.AutoDealTrialMemory.create();
  window.AutoDealTrialApp=window.AutoDealPaymentUI.mount(root,window.AutoDealTrialApi);
})();

</script>
