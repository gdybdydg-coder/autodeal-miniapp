<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070709">
  <title>AUTODEAL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="header"><div class="logo">AUTO<span>DEAL</span></div><button class="icon-button" id="settingsBtn" aria-label="Налаштування">⚙️</button></header>
  <h1>Знайди вигідне авто</h1>
  <p class="subtitle">Пошук автомобілів нижче ринкової ціни</p>

  <section class="search-box" aria-label="Фільтри пошуку">
    <div class="row group">
      <div><label class="label" for="brand">МАРКА</label><select id="brand" class="input"><option value="">Всі марки</option></select></div>
      <div><label class="label" for="model">МОДЕЛЬ</label><select id="model" class="input" disabled><option value="">Всі моделі</option></select></div>
    </div>
    <div class="group"><label class="label">ЦІНА, $</label><div class="row"><input id="priceFrom" class="input" type="number" inputmode="numeric" placeholder="Від"><input id="priceTo" class="input" type="number" inputmode="numeric" placeholder="До"></div></div>
    <div class="group"><label class="label">РІК</label><div class="row"><input id="yearFrom" class="input" type="number" inputmode="numeric" placeholder="Від"><input id="yearTo" class="input" type="number" inputmode="numeric" placeholder="До"></div></div>
    <div class="group"><label class="label" for="region">ОБЛАСТЬ</label><select id="region" class="input"></select></div>
    <button id="marketSwitch" class="market" type="button" role="switch" aria-checked="true">
      <span class="market-left"><span class="fire">🔥</span><span><strong>Тільки вигідні авто</strong><small>Нижче ринку мінімум на 15%</small></span></span><span class="switch active" aria-hidden="true"></span>
    </button>
    <button id="searchBtn" class="search-button" type="button">ПОКАЗАТИ АВТО</button>
  </section>

  <section id="results" class="results" aria-live="polite">
    <div class="results-head"><h2>🔥 Вигідні зараз</h2><span id="count" class="count"></span></div>
    <div id="resultsList" class="results-list"></div>
  </section>

  <nav class="navbar" aria-label="Головна навігація">
    <button class="nav active" data-tab="search"><span>🔎</span>Пошук</button>
    <button class="nav" data-tab="deals"><span>🔥</span>Вигідні</button>
    <button class="nav" data-tab="saved"><span>♡</span>Збережені</button>
    <button class="nav" data-tab="settings"><span>⚙️</span>Налаштування</button>
  </nav>
</main>
<div id="toast" class="toast" role="status"></div>
<script src="data/cars.js"></script>
<script src="app.js"></script>
</body>
</html>
